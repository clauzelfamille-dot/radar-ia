name: Publier Radar IA sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Générer le site
        run: python3 build/build.py --data data --out dist --site-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      # Après la mise en ligne : faire connaître les pages. Un échec ici ne remet pas en cause la publication.
      - name: Signaler les pages aux moteurs (IndexNow)
        continue-on-error: true
        run: python3 build/indexnow.py --dist dist --site-url "${{ steps.pages.outputs.base_url }}/"
      - name: Diffuser les nouveaux articles (Bluesky, Mastodon)
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python3 build/diffusion.py --dist dist
